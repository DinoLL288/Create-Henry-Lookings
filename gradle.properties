# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Force the Gradle daemon to run on the JDK 21 that is installed on this machine.
# (Gradle itself and Minecraft 1.21.1 both require Java 21.)
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.11.10-hotspot

# Mappings
# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Minecraft and NeoForge
# https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.244
loader_version_range=[1,)

# Mod Properties
mod_id=create_henry
mod_name=Create: Henry
mod_license=MIT
mod_version=1.0.3
mod_group_id=com.chocoboy.create_henry

# Dependencies
create_version=6.0.10-281
ponder_version=1.0.82+mc1.21.1
registrate_version=MC1.21-1.3.0+67
flywheel_version=1.0.6
